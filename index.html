<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B0B0D" />

    <!--seo-head-->
    <!-- Stable standalone raster files for browsers and Google Search. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32 48x48 96x96 256x256" type="image/x-icon" />
    <link rel="icon" href="/favicon.png" sizes="96x96" type="image/png" />
    <link rel="apple-touch-icon" href="/assets/brand/favicon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      Das Hero-Poster ist das LCP-Bild der Startseite. Der Preload startet den
      Download parallel zum JavaScript-Bundle, also deutlich früher, als React
      das Bild rendern könnte.

      Nur auf der Startseite: Auf /impressum und /datenschutz käme das Bild nie
      zum Einsatz, und der Browser meldete zu Recht einen ungenutzten Preload.
      Das Skript läuft im Head und damit früh genug, um den Vorsprung zu halten.
    -->
    <script>
      if (location.pathname === '/' || location.pathname === '/ru') {
        var l = document.createElement('link')
        l.rel = 'preload'
        l.as = 'image'
        l.type = 'image/avif'
        l.href = '/assets/photos/bridal-full-length-1080.avif'
        l.imageSrcset = '/assets/photos/bridal-full-length-640.avif 640w, /assets/photos/bridal-full-length-960.avif 960w, /assets/photos/bridal-full-length-1080.avif 1080w'
        l.imageSizes = '(min-width:1024px) 56vw, 100vw'
        l.setAttribute('fetchpriority', 'high')
        document.head.appendChild(l)
      }
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
