    <!-- Der Vektor zuerst: Browser, die ihn koennen, zeichnen ihn in jeder
         Kachelgroesse scharf. Die PNG bleiben als Rueckfallebene. -->

    <link rel="manifest" href="/site.webmanifest" />

    <!--
      Das Hero-Poster ist das LCP-Bild der Startseite. Der Preload startet den
      Download parallel zum JavaScript-Bundle, also deutlich früher, als React
      das Bild rendern könnte.

      Nur auf der Startseite: Auf /impressum und /datenschutz käme das Bild nie
      zum Einsatz, und der Browser meldete zu Recht einen ungenutzten Preload.
      Das Skript läuft im Head und damit früh genug, um den Vorsprung zu halten.
    -->
    <script>
      if (location.pathname === '/') {
        var l = document.createElement('link')
        l.rel = 'preload'
        l.as = 'image'
        l.type = 'image/avif'
        l.href = '/assets/posters/wedding.avif'
        l.setAttribute('fetchpriority', 'high')
        document.head.appendChild(l)
      }
    </script>

    <!--
      Strukturierte Daten. Es stehen ausschliesslich belegte Werte darin:
      Anschrift und Bewertungen fehlen, weil sie nicht vorliegen, und werden
      nicht erfunden. Nach Erhalt der rechtlichen Daten hier ergaenzen.
    -->
    <script type="application/ld+json">

        "sameAs": [
          "https://www.instagram.com/fotopanda.de/",
          "https://www.tiktok.com/@fotopanda.de"
        ]
      }
    </script>
